<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Course & Lab Feedback</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Course & Laboratory Feedback Portal</h1>
      <p>Help improve B.Tech teaching quality and lab facilities</p>
    </header>

    <div class="grid">
      <form id="fbForm" class="card">
        <h2>Submit Feedback</h2>
        <div class="field">
          <label for="studentName">Your Name (Optional)</label>
          <input type="text" id="studentName" placeholder="Leave blank for Anonymous" />
        </div>

        <div class="field">
          <label for="subject">Subject / Facility *</label>
          <select id="subject" required>
            <option value="BCS-101: C Programming">BCS-101: C Programming</option>
            <option value="BAS-103: Engineering Mathematics">BAS-103: Engineering Mathematics</option>
            <option value="CSE Linux Lab (Room 204)">CSE Linux Lab (Room 204)</option>
            <option value="Central Library & Wi-Fi">Central Library & Wi-Fi</option>
          </select>
        </div>

        <div class="field">
          <label for="rating">Rating (1 = Poor, 5 = Excellent) *</label>
          <select id="rating" required>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Needs Improvement</option>
            <option value="1">1 - Poor</option>
          </select>
        </div>

        <div class="field">
          <label for="comments">Suggestions / Comments</label>
          <textarea id="comments" rows="3" placeholder="Share specific feedback..."></textarea>
        </div>

        <button type="submit" class="btn">Submit Feedback</button>
        <p id="statusMsg" class="status"></p>
      </form>

      <section class="card">
        <h2>Recent Submissions</h2>
        <div id="feedbackList" class="fb-list"></div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
